services:
  - type: web
    name: t2-hydro-backend
    env: docker
    dockerfilePath: Dockerfile
    branch: main
    startCommand: bash -lc "gunicorn backend.app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGIN
        value: '*'

  - type: web
    name: t2-hydro-frontend
    env: docker
    dockerfilePath: Dockerfile
    branch: main
    startCommand: streamlit run frontend/streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGIN
        value: '*'
